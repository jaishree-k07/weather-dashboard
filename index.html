<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="clear">
  <main class="page">
    <header class="top">
      <h1>Weather</h1>
      <form id="form" class="search" novalidate>
        <label for="city" class="visually-hidden">City name</label>
        <input id="city" name="city" type="text" placeholder="Search a city, e.g. Pune"
               autocomplete="off" maxlength="60" aria-describedby="hint status">
        <button id="submit" type="submit">Get weather</button>
      </form>
      <p id="hint" class="hint" aria-live="polite"></p>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Search for a city to see its weather.</p>

    <section id="current" class="current" aria-label="Current weather" hidden></section>

    <section aria-labelledby="forecast-title" id="forecast-wrap" hidden>
      <h2 id="forecast-title">Next 5 days</h2>
      <div id="forecast" class="forecast"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
